name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: TypeScript build
        run: npm run build

      - name: Verify production entrypoints exist
        run: |
          test -f dist/src/mobile/index.js
          test -f dist/src/web/index.js
          test -f dist/src/admin/index.js
          test -f dist/src/scripts/migrate.js

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetbrain
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: budgetbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
          TZ: UTC
        run: npm run db:migrate

      - name: Run Test Suite
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_32_characters_minimum!
          JWT_REFRESH_SECRET: test_refresh_secret_32_characters_minimum!
          OPENAI_API_KEY: sk-test-ci-not-a-real-key
          TZ: UTC
        run: npm test
