name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run lint
        working-directory: backend
        run: npm run lint

      - name: TypeScript build
        working-directory: backend
        run: npm run build

      - name: Verify production entrypoints exist
        working-directory: backend
        run: |
          test -f dist/src/mobile/index.js
          test -f dist/src/web/index.js
          test -f dist/src/admin/index.js
          test -f dist/src/scripts/migrate.js

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetbrain
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: budgetbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Database Migrations
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
        run: npm run db:migrate

      - name: Run Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
          JWT_ACCESS_SECRET: test_access_secret_32_characters_minimum!
          JWT_REFRESH_SECRET: test_refresh_secret_32_characters_minimum!
        run: npm test
