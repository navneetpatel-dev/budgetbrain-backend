name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetbrain
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: budgetbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Run Database Migrations for Test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
        run: npm run db:migrate
      - name: Run Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: budgetbrain_test
          DB_USER: budgetbrain
          DB_PASSWORD: testpassword
          JWT_ACCESS_SECRET: test_access_secret_32_characters_minimum!
          JWT_REFRESH_SECRET: test_refresh_secret_32_characters_minimum!
        run: npm test
      - run: npm run build
      - name: Verify entrypoints
        run: |
          test -f dist/src/mobile/index.js
          test -f dist/src/web/index.js
          test -f dist/src/admin/index.js
          test -f dist/src/scripts/migrate.js

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${EC2_HOST:-}" ] || { echo "Missing secret EC2_HOST"; missing=1; }
          [ -n "${EC2_USER:-}" ] || { echo "Missing secret EC2_USER"; missing=1; }
          [ -n "${EC2_SSH_KEY:-}" ] || { echo "Missing secret EC2_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add these in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Write SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          case "${EC2_HOST}" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*)
              echo "EC2_HOST looks like a private VPC IP. Set the secret to the public IP 40.192.65.184"
              exit 1
              ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 <<'PY'
          import os, re, pathlib, sys

          raw = os.environ.get("EC2_SSH_KEY", "")
          raw = raw.strip().strip('"').strip("'")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          if raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2:
              match = re.match(
                  r"-----BEGIN ([^-]+)-----\s+(.+?)\s+-----END \1-----",
                  raw,
                  re.S,
              )
              if not match:
                  print("EC2_SSH_KEY is not a PEM private key.")
                  print("Paste the full budgetbrain.pem, including BEGIN and END lines.")
                  sys.exit(1)
              kind, body = match.group(1), match.group(2)
              body = re.sub(r"\s+", "", body)
              wrapped = "\n".join(body[i : i + 70] for i in range(0, len(body), 70))
              raw = f"-----BEGIN {kind}-----\n{wrapped}\n-----END {kind}-----"
          if not raw.endswith("\n"):
              raw += "\n"

          path = pathlib.Path.home() / ".ssh" / "budgetbrain.pem"
          path.write_text(raw)
          path.chmod(0o600)
          lines = raw.splitlines()
          print(f"Wrote key ({len(raw)} bytes, {len(lines)} lines)")
          print("Header:", lines[0])
          print("Footer:", lines[-1])
          PY
          ssh-keygen -y -f ~/.ssh/budgetbrain.pem >/dev/null

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DIR="${APP_DIR:-/var/www/budgetbrain-api}"
          USER="${EC2_USER:-ec2-user}"
          USER_HOST="${USER}@${EC2_HOST}"

          ssh -4 -i ~/.ssh/budgetbrain.pem -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$USER_HOST" \
            "export APP_DIR='${DIR}' DEPLOY_BRANCH='main' && bash '${DIR}/scripts/deploy.sh'"
