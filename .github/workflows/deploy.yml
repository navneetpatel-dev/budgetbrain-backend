name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Verify entrypoints
        run: |
          test -f dist/mobile/index.js
          test -f dist/web/index.js
          test -f dist/admin/index.js
          test -f dist/scripts/migrate.js

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${EC2_HOST:-}" ] || { echo "Missing secret EC2_HOST"; missing=1; }
          [ -n "${EC2_USER:-}" ] || { echo "Missing secret EC2_USER"; missing=1; }
          [ -n "${EC2_SSH_KEY:-}" ] || { echo "Missing secret EC2_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add these in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          case "${EC2_HOST}" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*)
              echo "EC2_HOST looks like a private VPC IP. Set the secret to the public IP 40.192.65.184"
              exit 1
              ;;
          esac
          ssh-keyscan -4 -p "$PORT" -T 15 "$EC2_HOST" >> ~/.ssh/known_hosts || true
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "Could not scan host keys (will use accept-new on SSH)."
          fi

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DIR="${APP_DIR:-/var/www/budgetbrain-api}"
          USER="${EC2_USER:-ec2-user}"
          USER_HOST="${USER}@${EC2_HOST}"

          ssh -4 -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$USER_HOST" \
            "export APP_DIR='${DIR}' DEPLOY_BRANCH='main' && bash '${DIR}/scripts/deploy.sh'"
