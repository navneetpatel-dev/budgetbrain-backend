# BudgetBrain API reverse proxy
# Replace api-mobile / api-web / api-admin hostnames with your domains.
# After DNS points here:
#   sudo certbot --nginx -d api-mobile.yourdomain.com -d api-web.yourdomain.com -d api-admin.yourdomain.com

upstream budgetbrain_mobile {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream budgetbrain_web {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream budgetbrain_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

# Shared proxy settings
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-mobile.yourdomain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_mobile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://budgetbrain_mobile/health;
        access_log off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-web.yourdomain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://budgetbrain_web/health;
        access_log off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-admin.yourdomain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://budgetbrain_admin/health;
        access_log off;
    }
}
