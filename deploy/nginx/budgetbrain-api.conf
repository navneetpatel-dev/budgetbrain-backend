# BudgetBrain API reverse proxy
#
# Path-based (works with Elastic IP, no DNS):
#   http://<EC2_PUBLIC_IP>/mobile/api/v1
#   http://<EC2_PUBLIC_IP>/web/api/v1
#   http://<EC2_PUBLIC_IP>/admin/api/v1
#
# Optional hostnames (after DNS):
#   api-mobile.yourdomain.com  api-web.yourdomain.com  api-admin.yourdomain.com
#   sudo certbot --nginx -d api-mobile.yourdomain.com -d api-web.yourdomain.com -d api-admin.yourdomain.com

upstream budgetbrain_mobile {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream budgetbrain_web {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream budgetbrain_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy headers (inlined in each location for Amazon Linux / Ubuntu)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 20M;

    location /mobile/ {
        proxy_pass http://budgetbrain_mobile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /web/ {
        proxy_pass http://budgetbrain_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://budgetbrain_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-mobile.yourdomain.com;
    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_mobile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-web.yourdomain.com;
    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-admin.yourdomain.com;
    client_max_body_size 20M;

    location / {
        proxy_pass http://budgetbrain_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
