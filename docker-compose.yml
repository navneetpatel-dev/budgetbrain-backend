name: budgetbrain

services:
  postgres:
    image: postgres:16-alpine
    container_name: budgetbrain
    restart: unless-stopped
    environment:
      POSTGRES_USER: navneet
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: budgetbrain
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: budgetbrain-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
